name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build (windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -o clash-profile-ui.exe .

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build binary
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/clash-profile-ui.exe .
      - name: package
        run: |
          cd dist
          zip "clash-profile-ui-${{ github.ref_name }}-windows-amd64.zip" clash-profile-ui.exe
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clash-profile-ui-${{ github.ref_name }}-windows-amd64.zip
          generate_release_notes: true
